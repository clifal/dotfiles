<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
    </marker>
  </defs>

  <rect width="1200" height="800" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="58" text-anchor="middle" font-size="34" font-weight="700" fill="#1f2430">OpenCost と Kubecost の違い</text>
  <text x="600" y="94" text-anchor="middle" font-size="18" fill="#5b6472">Kubecost は OpenCost を組み込んだ製品。違いは足された機能、ライセンス、データの保存先</text>

  <!-- Column 1: OpenCost (blue) -->
  <rect x="40" y="124" width="520" height="404" rx="16" fill="#eef3fb" stroke="#9db4d9"/>
  <path d="M56,124 H544 A16,16 0 0 1 560,140 V196 H40 V140 A16,16 0 0 1 56,124 Z" fill="#3d6fb6"/>
  <text x="300" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">OpenCost</text>
  <text x="300" y="185" text-anchor="middle" font-size="14" fill="#dfe8f6">CNCF Incubating の OSS ｜ v1.121.3</text>
  <text x="300" y="234" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">Kubernetes のコストを割り振る OSS の計算エンジン</text>

  <g font-size="14" fill="#5b6472">
    <rect x="60" y="260" width="480" height="78" rx="10" fill="#ffffff" stroke="#9db4d9"/>
    <text x="80" y="286" font-size="15" font-weight="700" fill="#1f2430">データの保存先</text>
    <text x="80" y="308">Prometheus に保存する</text>
    <text x="80" y="327">Prometheus は別に用意する</text>

    <rect x="60" y="350" width="480" height="78" rx="10" fill="#ffffff" stroke="#9db4d9"/>
    <text x="80" y="376" font-size="15" font-weight="700" fill="#1f2430">ライセンスと費用</text>
    <text x="80" y="398">Apache-2.0。ソースはすべて公開</text>
    <text x="80" y="417">有償版は無い</text>

    <rect x="60" y="440" width="480" height="78" rx="10" fill="#ffffff" stroke="#9db4d9"/>
    <text x="80" y="466" font-size="15" font-weight="700" fill="#1f2430">できること</text>
    <text x="80" y="488">コストの割り振り、クラウド費用の表示</text>
    <text x="80" y="507">外部 SaaS の費用はプラグインで取り込める</text>
  </g>

  <!-- Relation: OpenCost is bundled in Kubecost -->
  <text x="600" y="282" text-anchor="middle" font-size="14" font-weight="700" fill="#5b6472">同梱</text>
  <line x1="566" y1="298" x2="632" y2="298" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="320" text-anchor="middle" font-size="11" fill="#5b6472">v1.121.3</text>

  <!-- Column 2: Kubecost (teal) -->
  <rect x="640" y="124" width="520" height="404" rx="16" fill="#ecf7f3" stroke="#8cc7b0"/>
  <path d="M656,124 H1144 A16,16 0 0 1 1160,140 V196 H640 V140 A16,16 0 0 1 656,124 Z" fill="#2f8a6a"/>
  <text x="900" y="160" text-anchor="middle" font-size="26" font-weight="700" fill="#ffffff">Kubecost</text>
  <text x="900" y="185" text-anchor="middle" font-size="14" fill="#dcf1e8">IBM の製品 ｜ v3.3.0</text>
  <text x="900" y="234" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2430">OpenCost を組み込み、管理と自動化を足した製品</text>

  <g font-size="14" fill="#5b6472">
    <rect x="660" y="260" width="480" height="78" rx="10" fill="#ffffff" stroke="#8cc7b0"/>
    <text x="680" y="286" font-size="15" font-weight="700" fill="#1f2430">データの保存先</text>
    <text x="680" y="308">オブジェクトストレージと、組み込みの ClickHouse</text>
    <text x="680" y="327">v3.0 から Prometheus と Grafana は不要</text>

    <rect x="660" y="350" width="480" height="78" rx="10" fill="#ffffff" stroke="#8cc7b0"/>
    <text x="680" y="376" font-size="15" font-weight="700" fill="#1f2430">ライセンスと費用</text>
    <text x="680" y="398">製品本体のソースは非公開（IBM の IPLA）</text>
    <text x="680" y="417">無償版と Enterprise 版がある</text>

    <rect x="660" y="440" width="480" height="78" rx="10" fill="#ffffff" stroke="#8cc7b0"/>
    <text x="680" y="466" font-size="15" font-weight="700" fill="#1f2430">できること</text>
    <text x="680" y="488">OpenCost の機能に加え、請求額との突き合わせ、自動調整</text>
    <text x="680" y="507">予算、異常検知、複数クラスターの統合ビュー（Enterprise 版）</text>
  </g>

  <!-- Bottom: how to choose -->
  <text x="40" y="572" font-size="20" font-weight="700" fill="#1f2430">選び方</text>
  <g font-size="16" fill="#1f2430">
    <rect x="40" y="588" width="700" height="32" rx="8" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="58" y="610">費用をかけず、OSS だけで組みたい</text>
    <line x1="748" y1="604" x2="792" y2="604" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="588" width="360" height="32" rx="16" fill="#3d6fb6"/>
    <text x="980" y="610" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">OpenCost</text>

    <rect x="40" y="626" width="700" height="32" rx="8" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="58" y="648">Prometheus をすでに運用している</text>
    <line x1="748" y1="642" x2="792" y2="642" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="626" width="360" height="32" rx="16" fill="#3d6fb6"/>
    <text x="980" y="648" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">OpenCost</text>

    <rect x="40" y="664" width="700" height="32" rx="8" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="58" y="686">AKS（Standard 以上のティア）で手軽に使いたい</text>
    <line x1="748" y1="680" x2="792" y2="680" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="664" width="360" height="32" rx="16" fill="#3d6fb6"/>
    <text x="980" y="686" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">AKS の cost analysis（OpenCost）</text>

    <rect x="40" y="702" width="700" height="32" rx="8" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="58" y="724">請求額に合わせた金額、予算、異常検知、自動調整がほしい</text>
    <line x1="748" y1="718" x2="792" y2="718" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="702" width="360" height="32" rx="16" fill="#2f8a6a"/>
    <text x="980" y="724" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Kubecost</text>

    <rect x="40" y="740" width="700" height="32" rx="8" fill="#f6f7f9" stroke="#c9ced6"/>
    <text x="58" y="762">複数クラスターを 1 画面で見たい</text>
    <line x1="748" y1="756" x2="792" y2="756" stroke="#5b6472" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="800" y="740" width="360" height="32" rx="16" fill="#2f8a6a"/>
    <text x="980" y="762" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">Kubecost（Enterprise / EKS バンドル）</text>
  </g>
</svg>
